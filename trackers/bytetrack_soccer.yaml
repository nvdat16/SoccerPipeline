# ByteTrack cho video bóng đá broadcast — MẶC ĐỊNH (config.TRACKER). Cùng ngưỡng với botsort_soccer.yaml.
# Detector chạy ở conf thấp (config.DET_CONF = 0.1): box 0.1-0.3 KHÔNG tạo track mới, chỉ dùng ở bước ghép
# thứ 2 của BYTE để giữ track cũ khi detector thấy mờ (cầu thủ xa, bị che một phần).
tracker_type: bytetrack
track_high_thresh: 0.3    # bước ghép 1: box chắc chắn
track_low_thresh: 0.1     # bước ghép 2: box 0.1-0.3 chỉ nối vào track đang có
new_track_thresh: 0.4     # track mới cần box >= 0.4 (ít track rác từ box yếu)
track_buffer: 50          # giữ track mất dấu ~2 s ở 25 fps (bị che khi 2 cầu thủ cắt nhau)
match_thresh: 0.8
fuse_score: True


